apiVersion: v1
kind: ConfigMap
metadata:
  name: wsj27-cms-config
data:
  # The CMS shares the campfire host with wsj27-auth-api because the SSO
  # session is host-scoped cookies; the /_services/cms base path is baked into
  # the image at build time (NEXT_BASE_PATH build-arg in the app repo's CI).
  SERVER_URL: "https://campfire.wsj27.scouterna.net/_services/cms"
  AUTH_DISCOVERY_URL: "https://campfire.wsj27.scouterna.net/auth/.well-known/openid-configuration"
